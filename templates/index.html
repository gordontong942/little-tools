<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geocaching Extractor (Python Backend Proxy)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: { 850: '#0f172a', 900: '#090d16', 950: '#030712' }
                    },
                    fontFamily: { mono: ['JetBrains Mono', 'monospace'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #090d16; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen flex flex-col antialiased">

    <!-- Header -->
    <header class="h-14 border-b border-slate-800 bg-slate-900/60 backdrop-blur sticky top-0 z-50 flex items-center px-6 justify-between">
        <div class="flex items-center space-x-3">
            <div class="h-8 w-8 rounded-lg bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center text-indigo-400">
                <i class="fa-solid fa-satellite-dish text-sm"></i>
            </div>
            <span class="font-semibold text-sm text-white">Geocaching Python Backend Extractor</span>
        </div>
        <div class="text-xs font-mono text-emerald-400 bg-emerald-950/60 border border-emerald-800 px-2.5 py-1 rounded-full">
            <span class="inline-block h-2 w-2 rounded-full bg-emerald-500 mr-1.5 animate-pulse"></span> Python Session Proxy Active
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-[1600px] w-full mx-auto p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- Sidebar Controls -->
        <aside class="lg:col-span-4 space-y-4">
            <div class="bg-slate-900/80 rounded-xl p-4 border border-slate-800 space-y-4">
                <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400">
                    <i class="fa-solid fa-sliders text-indigo-400 mr-1.5"></i> Configuration
                </h2>

                <div class="space-y-1.5">
                    <label class="text-xs font-medium text-slate-300">Cookie String</label>
                    <textarea id="cookieInput" rows="4" placeholder="gspkauth=...; gspk=..."
                        class="w-full px-3 py-2 text-xs font-mono rounded-lg border border-slate-800 bg-slate-950 text-slate-200 focus:border-indigo-500 focus:outline-none resize-none"></textarea>
                </div>

                <div class="space-y-1.5">
                    <label class="text-xs font-medium text-slate-300">Bounding Box (MaxLat, MinLng, MinLat, MaxLng)</label>
                    <input type="text" id="bboxInput" value="22.55,113.85,22.15,114.40"
                        class="w-full px-3 py-2 text-xs font-mono rounded-lg border border-slate-800 bg-slate-950 text-slate-200 focus:outline-none">
                </div>

                <button onclick="startExtraction()" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2 px-4 rounded-lg text-xs transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-bolt"></i> Run Python Proxy Task
                </button>
            </div>
        </aside>

        <!-- Viewport Workspace -->
        <section class="lg:col-span-8 flex flex-col space-y-4">
            <div class="bg-slate-900/80 rounded-xl border border-slate-800 p-4 font-mono text-xs h-[500px] flex flex-col">
                <div class="border-b border-slate-800 pb-2 mb-3 text-slate-500 flex justify-between items-center">
                    <span>Execution Terminal</span>
                    <button onclick="document.getElementById('terminal').innerHTML=''" class="text-xs hover:text-slate-300">Clear</button>
                </div>
                <div id="terminal" class="flex-1 overflow-y-auto space-y-1 text-slate-300">
                    <div>[System Ready] Click 'Run Python Proxy Task' to begin backend session queries.</div>
                </div>
            </div>
        </section>
    </main>

    <script>
        async function log(msg, type = 'info') {
            const term = document.getElementById('terminal');
            const div = document.createElement('div');
            div.className = type === 'error' ? 'text-rose-400' : (type === 'success' ? 'text-emerald-400' : 'text-slate-300');
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            term.appendChild(div);
            term.scrollTop = term.scrollHeight;
        }

        async function startExtraction() {
            const cookie = document.getElementById('cookieInput').value.trim();
            const bbox = document.getElementById('bboxInput').value.trim();
            
            if (!cookie) {
                alert('Please input your cookie string.');
                return;
            }

            log('Step 1: Requesting map page via Python backend session...', 'info');

            try {
                // 1. Fetch map page to parse buildId
                const mapRes = await fetch('/api/proxy', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ endpoint: '/play/map', cookie: cookie })
                });
                
                const mapData = await mapRes.json();
                if (!mapRes.ok) throw new Error(mapData.error || 'Failed to fetch map page');

                const html = mapData.html || '';
                const buildIdMatch = html.match(/"buildId"\s*:\s*"([^"]+)"/);
                if (!buildIdMatch) throw new Error('Could not parse buildId from Next.js data.');
                
                const buildId = buildIdMatch[1];
                log(`Successfully extracted buildId: ${buildId}`, 'success');

                // 2. Fetch Bounding Box JSON
                log('Step 2: Fetching bounding box results...', 'info');
                const mapJsonEndpoint = `/_next/data/${buildId}/en/play/map.json?box=${encodeURIComponent(bbox)}`;
                
                const jsonRes = await fetch('/api/proxy', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ endpoint: mapJsonEndpoint, cookie: cookie })
                });

                const jsonData = await jsonRes.json();
                if (!jsonRes.ok) throw new Error(jsonData.error || 'Failed to fetch map json');

                const results = jsonData?.pageProps?.searchResults?.results || [];
                log(`Successfully fetched ${results.length} geocaches via Python backend!`, 'success');

            } catch (err) {
                log(`Error: ${err.message}`, 'error');
            }
        }
    </script>
</body>
</html>
